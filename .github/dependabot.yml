version: 2
updates:
  # Enable version updates for Python packages
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    # Group all minor + patch bumps into a single weekly PR to cut noise.
    # Major bumps are excluded from the group, so they still open separately.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # torch and flash-attn are pinned to flash-attn's prebuilt wheel matrix, and
    # ntt is pinned to a release tag that the lock and the docs refer to.
    ignore:
      - dependency-name: "torch"
      - dependency-name: "flash-attn"
      - dependency-name: "ntt"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    # Group all minor + patch bumps into a single weekly PR to cut noise.
    # Major bumps are excluded from the group, so they still open separately.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
