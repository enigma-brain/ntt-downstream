defaults:
    - data: wingert_auditory
    - backbone: causal_conv
    - model: audio_encoding_tokenizer
    - trainer: default
    - _self_

model:
    loss_mode: "flow_matching"
    flow:
        depth: 3
        width: 256
        # Rectified-flow training options (defaults shown).
        time_sampling: "uniform"   # or "logit_normal" (SD3-style)
        logit_normal_mean: 0.0
        logit_normal_std: 1.0
        ot_coupling: false         # minibatch-OT noise pairing
        cond_dropout: 0.0          # >0 enables CFG at eval

tokenizer:
    enabled: true
    checkpoint_first: true
    tokenizer_window_length_seconds: null
    latent_scale: "auto"
    spec:
        _target_: ntt.contrib.tokenizer.compressed_sensing.CompressedSensingTokenizerSpec
        KIND: compressed_sensing
        n_neurons: 100
        window_length_seconds: 0.1
        bin_size_ms: 10.0
        latent_dim: 48
        compress_mode: "per_neuron"

trainer:
    experiment_name: "wingert-auditory-encoding"
    eval_skip_seconds: 0.0
    eval_rebin_hz: null
    tokenizer_mode: "frozen"

tags:
    model: "audio_tokenizer_flow_matching"
    dataset: "wingert_auditory"

description: "Wingert auditory cortex: CausalConv + cross-attention, flow matching on tokenizer latents."
