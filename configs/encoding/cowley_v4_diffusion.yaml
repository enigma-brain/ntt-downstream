defaults:
  - data: cowley_v4
  - backbone: hiera_pretrained_224
  - model: image_encoding_diffusion
  - trainer: default
  - _self_

tokenizer:
  enabled: true
  checkpoint_first: true
  spec:
    _target_: ntt.contrib.tokenizer.compressed_sensing.CompressedSensingTokenizerSpec
    KIND: compressed_sensing
    n_neurons: 100
    window_length_seconds: 0.2
    bin_size_ms: 1.0
    latent_dim: 48
    trainable: false
    random_seed: 0
    shuffling_strategy: "none"
    sampling_strategy: "uniform"
    compress_mode: "per_neuron"
    matrix_type: "sinusoidal"
    sinusoidal_base: 150
    sinusoidal_norm: true

trainer:
  eval_rebin_hz: 200

tags:
  model: "hiera_small_diffusion"
  dataset: "cowley_v4"

description: "DiffLoss model on Cowley V4."
