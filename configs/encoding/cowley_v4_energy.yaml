defaults:
  - data: cowley_v4
  - backbone: hiera_pretrained_224
  - model: image_encoding_energy
  - trainer: default
  - _self_

tokenizer:
  enabled: true
  checkpoint_first: true
  # Per-channel z-scoring of the tokenizer latent. Required for energy loss:
  # the score is L2-distance based, so unequal per-channel variances would let
  # high-variance dims dominate the gradient and starve low-variance dims.
  # Calibrated from ~50 training batches at setup time.
  latent_scale: "auto_per_channel"
  spec:
    _target_: ntt.contrib.tokenizer.compressed_sensing.CompressedSensingTokenizerSpec
    KIND: compressed_sensing
    n_neurons: 100
    window_length_seconds: 0.2
    bin_size_ms: 1.0
    latent_dim: 48
    trainable: false
    random_seed: 0
    shuffling_strategy: "none"
    sampling_strategy: "uniform"
    compress_mode: "per_neuron"
    matrix_type: "sinusoidal"
    sinusoidal_base: 150
    sinusoidal_norm: true

trainer:
  # eval_rebin_hz: 200
  # EAR paper Sec. 4.3: MLP generator requires a lower LR than the rest of the
  # model to stabilize training. lambda = 0.25 is the paper default.
  energy_lr_multiplier: 0.25
  # Uncomment and set an absolute energy_lr to override the multiplier.
  # energy_lr: 2.5e-5

tags:
  model: "hiera_small_energy"
  dataset: "cowley_v4"

description: "EAR energy-score model on Cowley V4."
