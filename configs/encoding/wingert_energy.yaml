defaults:
    - data: wingert_auditory
    - backbone: causal_conv
    - model: audio_encoding_tokenizer
    - trainer: default
    - _self_

model:
    loss_mode: "energy"
    energy:
        depth: 3
        width: 256
        noise_channels: 64
        alpha: 1.5
        train_temperature: 1.0
    diffusion_batch_mul: 4

tokenizer:
    enabled: true
    checkpoint_first: true
    tokenizer_window_length_seconds: null
    # Per-channel calibration recommended for energy loss.
    latent_scale: "auto_per_channel"
    spec:
        _target_: ntt.contrib.tokenizer.compressed_sensing.CompressedSensingTokenizerSpec
        KIND: compressed_sensing
        n_neurons: 100
        window_length_seconds: 0.1
        bin_size_ms: 10.0
        latent_dim: 48
        compress_mode: "per_neuron"

trainer:
    experiment_name: "wingert-auditory-encoding"
    eval_skip_seconds: 0.0
    eval_rebin_hz: null
    tokenizer_mode: "frozen"

tags:
    model: "audio_tokenizer_energy"
    dataset: "wingert_auditory"

description: "Wingert auditory cortex: CausalConv + cross-attention, EAR energy-score loss on tokenizer latents."
