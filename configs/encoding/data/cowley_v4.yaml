# @package _global_
data:
    dataset_path: "./data/cowley_v4_compact_2024"
    response_window: 0.200 # duration of response window in seconds
    bin_size: 0.001 # 1ms bins → 200 time bins
    response_offset: 0.0 # seconds from stimulus onset to start of response window (0 = onset)
    train_on_averaged: false # if true, train on trial-averaged responses (one item per unique image)
    author_split: null # null = all sessions, or "train"/"val"/"test"
    session_ids: null # null = all sessions, or list of session IDs
    subjects: null # null = all subjects, or "Pepe" / ["Raul", "Wakko"] to filter by animal
    image_size: null # null = native 112x112, or [224, 224] for pretrained backbone
    min_snr: null # null = keep all units, or e.g. 0.15 for Cowley-matched SNR filtering

dataloader:
    batch_size: 64
    num_workers: 4
    prefetch_factor: 2
    persistent_workers: true
